# 生产同源 nginx 配置（feature001 阶段一）
# 静态托管 _frontend/dist + 反代三段 /api/* 路径到 z-vector-server :6333。
#
# 为什么用 /api/ 前缀：浏览器刷新 /collections/demo 这种深链时，前端 SPA 路由要拿到
# index.html。如果让 nginx 也代理 /collections/* 到后端，刷新就拿到 JSON 而不是 SPA。
# /api/ 前缀把后端调用与 SPA 路由完全隔离。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;   # _frontend/dist 拷到这里
    index index.html;

    # gzip
    gzip on;
    gzip_types application/json application/javascript text/css;

    # 后端反代：/api/{collections,health,__instance}
    # rewrite 把 /api/* 还原成 /* 再转给后端（与 vite dev proxy 同口径）
    location /api/collections/ { rewrite ^/api(.*)$ $1 break; proxy_pass http://127.0.0.1:6333; proxy_set_header Host $host; }
    location = /api/health     { rewrite ^/api(.*)$ $1 break; proxy_pass http://127.0.0.1:6333; proxy_set_header Host $host; }
    location = /api/__instance { rewrite ^/api(.*)$ $1 break; proxy_pass http://127.0.0.1:6333; proxy_set_header Host $host; }

    # SPA fallback：所有 /collections /search /instance 这种前端路由都返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
