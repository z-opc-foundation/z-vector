# z-vector 部署到家庭 k3s 集群（192.168.31.250）
#
# 结构：后端 z-vector-server（:6333 REST）+ 前端 z-vector-frontend（nginx :80）
# 前端通过 /api/** 反代到后端 Service，两者在同一 namespace 内按服务名通信。
#
# 与 z-graph 的差异：z-vector 没有 Bolt 端口，只有 REST 一套。
# 数据落 ZVECTOR_DATA_DIR，走 PVC。
#
# 使用：
#   kubectl apply -f z-vector.yaml
#   kubectl -n z-vector port-forward svc/z-vector-frontend 3001:80
#
# 镜像说明：tag 走本地构建后 docker save + k3s ctr import，不依赖外网仓库。
---
apiVersion: v1
kind: Namespace
metadata:
  name: z-vector
  labels:
    app.kubernetes.io/part-of: z-vector

---
# ===== 后端配置 =====
apiVersion: v1
kind: ConfigMap
metadata:
  name: z-vector-config
  namespace: z-vector
data:
  ZVECTOR_PORT: "6333"
  ZVECTOR_DATA_DIR: "/data/zvector"
  # bind 地址：进程缺省是回环（127.0.0.1）。
  # 但本 Deployment 的 Service 是 NodePort，靠 kubelet 把流量转发到 Pod IP:6333 ——
  # 进程只绑回环的话，Service/探针都连不上（Pod 会一直 NotReady）。
  # 所以这里**显式**声明 0.0.0.0：这是「暴露面是有意为之」的声明，不是默认值兜底。
  # 想收回 LAN 暴露面请改 Service 拓扑（ClusterIP + 前端同 Pod 反代）或加鉴权，
  # 不要靠把 bind 地址改回默认值 —— 默认值已经是回环了。
  ZVECTOR_HOST: "0.0.0.0"
  # 默认索引：空 = 走内置 FLAT。拼错不静默降级，进程直接起不来。
  ZVECTOR_DEFAULT_INDEX: ""
  ZVECTOR_INDEX_PARAMS: ""
  JAVA_OPTS: "-Xms512m -Xmx2048m -XX:+UseG1GC"

---
# ===== 后端 Deployment =====
# 数据不再走 PVC（2026-11-11 持久化规范）：真源目录 = 节点 zifang002 的
# /home/zifang/data/z-vector，由下方 Deployment 的 hostPath + nodeSelector 成对钉住。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: z-vector-server
  namespace: z-vector
  labels:
    app.kubernetes.io/name: z-vector-server
    app.kubernetes.io/part-of: z-vector
spec:
  replicas: 1
  # 单副本：底层存储不支持并发写
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: z-vector-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: z-vector-server
        app.kubernetes.io/part-of: z-vector
    spec:
      # ⚠ 与 hostPath 成对钉节点（「注意分布式」）：数据在节点本地盘 ⇒ pod 漂到别的节点即丢数据。
      nodeSelector:
        kubernetes.io/hostname: zifang002
      containers:
        - name: z-vector-server
          image: z-vector:20261111-7775be2
          imagePullPolicy: Never
          ports:
            - name: rest
              containerPort: 6333
          envFrom:
            - configMapRef:
                name: z-vector-config
          readinessProbe:
            httpGet:
              path: /health
              port: rest
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: rest
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data/zvector
      volumes:
        # 向量库真源 = zifang002:/home/zifang/data/z-vector（2026-11-11 自 PVC 迁入）。
        # ⚠ 节点侧目录属主须为容器运行 uid（10001），否则 wal.log 写入 Permission denied
        #   （2026-11-11 实测：root:644 的 wal.log 直接 CrashLoopBackOff）。
        - name: data
          hostPath:
            path: /home/zifang/data/z-vector
            type: Directory

---
apiVersion: v1
kind: Service
metadata:
  name: z-vector-server
  namespace: z-vector
  labels:
    app.kubernetes.io/name: z-vector-server
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: z-vector-server
  ports:
    - name: rest
      port: 6333
      targetPort: rest
      nodePort: 30333

---
# ===== 前端 Deployment =====
apiVersion: apps/v1
kind: Deployment
metadata:
  name: z-vector-frontend
  namespace: z-vector
  labels:
    app.kubernetes.io/name: z-vector-frontend
    app.kubernetes.io/part-of: z-vector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: z-vector-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: z-vector-frontend
        app.kubernetes.io/part-of: z-vector
    spec:
      containers:
        - name: z-vector-frontend
          image: z-vector-frontend:20261111-7775be2
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 80
          env:
            # nginx entrypoint 会 envsubst 这个变量进 nginx.conf.template。
            # 与后端 Service 同 namespace，按服务名走。
            - name: ZVECTOR_API_UPSTREAM
              value: z-vector-server:6333
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: z-vector-frontend
  namespace: z-vector
  labels:
    app.kubernetes.io/name: z-vector-frontend
spec:
  selector:
    app.kubernetes.io/name: z-vector-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
  # NodePort：与 docker 版 6333/3000 并存不撞车（用户拍板：新旧并存）
  type: NodePort